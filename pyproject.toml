[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-predictor"
version = "0.9.0"
description = "Leak-free Premier League match outcome prediction pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
xgboost = ["xgboost==3.4.1"]
ml = ["xgboost==3.4.1", "shap>=0.46"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.28"]

[project.scripts]
pl-predictor = "pl_predictor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
