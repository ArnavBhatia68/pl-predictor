name: Keep live football data fresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pl-predictor-live-refresh
  cancel-in-progress: false

jobs:
  refresh-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out snapshot tooling
        uses: actions/checkout@v4

      - name: Wake API
        run: curl --fail --retry 20 --retry-delay 15 --retry-all-errors --max-time 600 https://pl-predictor-api-5ie5.onrender.com/health

      - name: Start refresh when due
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            --request POST \
            https://pl-predictor-api-5ie5.onrender.com/automation/refresh-due \
            --output refresh-trigger.json
          cat refresh-trigger.json

      - name: Wait for current data refresh
        shell: bash
        run: |
          wait_for_completion="$(jq -r '.wait_for_completion' refresh-trigger.json)"
          previous_completed_at="$(jq -r '.previous_completed_at // .refresh.completed_at // ""' refresh-trigger.json)"
          for attempt in {1..180}; do
            status="$(curl --silent --show-error --fail https://pl-predictor-api-5ie5.onrender.com/refresh-status || true)"
            state="$(echo "$status" | jq -r '.state // "unknown"')"
            completed_at="$(echo "$status" | jq -r '.completed_at // ""')"
            if [[ "$state" == "error" ]]; then
              echo "$status"
              exit 1
            fi
            if [[ "$state" == "ready" ]] && { [[ "$wait_for_completion" != "true" ]] || [[ "$completed_at" != "$previous_completed_at" ]]; }; then
              exit 0
            fi
            sleep 10
          done
          echo "The API did not finish refreshing within thirty minutes."
          exit 1

      - name: Download immutable prediction history
        run: curl --fail --retry 5 --retry-delay 5 https://pl-predictor-api-5ie5.onrender.com/live-predictions?limit=1000 -o predictions-current.json

      - name: Download durable prediction history
        run: |
          curl --silent --show-error --fail \
            https://raw.githubusercontent.com/${{ github.repository }}/live-data/predictions.json \
            --output predictions-durable.json \
            || printf '{"predictions":[]}' > predictions-durable.json

      - name: Merge without deleting official predictions
        run: |
          PYTHONPATH=src python -m pl_predictor.snapshot \
            predictions-durable.json \
            predictions-current.json \
            predictions.json
          durable_count="$(jq '.predictions | length' predictions-durable.json)"
          merged_count="$(jq '.predictions | length' predictions.json)"
          if (( merged_count < durable_count )); then
            echo "Refusing to replace a $durable_count-row ledger with $merged_count rows."
            exit 1
          fi

      - name: Save season snapshot branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'live-data';
            const content = fs.readFileSync('predictions.json').toString('base64');

            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: main.data.commit.sha,
              });
            }

            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner, repo, path: 'predictions.json', ref: branch,
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'predictions.json',
              branch,
              message: 'chore: snapshot live predictions',
              content,
              ...(sha ? { sha } : {}),
            });
