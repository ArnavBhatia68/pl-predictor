name: Keep live football data fresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pl-predictor-live-refresh
  cancel-in-progress: false

jobs:
  refresh-and-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API
        run: curl --fail --retry 12 --retry-delay 10 --retry-all-errors --max-time 180 https://pl-predictor-api-5ie5.onrender.com/health

      - name: Wait for current data refresh
        shell: bash
        run: |
          for attempt in {1..36}; do
            status="$(curl --silent --show-error --fail https://pl-predictor-api-5ie5.onrender.com/refresh-status || true)"
            if echo "$status" | jq -e '.state == "ready"' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "The API did not finish refreshing within six minutes."
          exit 1

      - name: Download immutable prediction history
        run: curl --fail --retry 5 --retry-delay 5 https://pl-predictor-api-5ie5.onrender.com/live-predictions?limit=1000 -o predictions.json

      - name: Save season snapshot branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'live-data';
            const content = fs.readFileSync('predictions.json').toString('base64');

            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: main.data.commit.sha,
              });
            }

            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner, repo, path: 'predictions.json', ref: branch,
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'predictions.json',
              branch,
              message: 'chore: snapshot live predictions',
              content,
              ...(sha ? { sha } : {}),
            });
