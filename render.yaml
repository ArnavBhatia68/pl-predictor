services:
  - type: web
    name: pl-predictor-api
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: CURRENT_SEASON_START
        value: "2026"
      - key: HISTORICAL_START_SEASON
        value: "2000"
      - key: AUTO_REFRESH_INTERVAL_HOURS
        value: "6"
      - key: PL_PREDICTOR_DB_PATH
        value: /tmp/pl_predictor.sqlite3
      - key: FOOTBALL_DATA_API_TOKEN
        sync: false
      - key: SYNC_API_KEY
        generateValue: true
