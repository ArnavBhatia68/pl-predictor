services:
  - type: web
    name: pl-predictor-api
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: HISTORICAL_START_SEASON
        value: "2000"
      - key: PREDICTION_PUBLISH_LEAD_DAYS
        value: "3"
      - key: AUTO_REFRESH_INTERVAL_HOURS
        value: "1"
      - key: PREDICTION_SEED_URL
        value: https://raw.githubusercontent.com/ArnavBhatia68/pl-predictor/live-data/predictions.json
      - key: PL_PREDICTOR_DB_PATH
        value: /tmp/pl_predictor.sqlite3
      - key: FOOTBALL_DATA_API_TOKEN
        sync: false
      - key: SYNC_API_KEY
        generateValue: true
